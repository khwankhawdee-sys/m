<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>รายการคำสั่งซื้อ — Body Scent</title>
  <link rel="stylesheet" href="style.css">

  <style>
    .table-wrap {
      overflow-x: auto;
      background: var(--color-white);
      border: 1px solid var(--color-line);
      border-radius: var(--radius);
    }

    #ordersTable {
      width: 100%;
      min-width: 760px;
      border-collapse: collapse;
      font-size: 0.9rem;
    }

    #ordersTable th,
    #ordersTable td {
      padding: 1rem 1.25rem;
      text-align: left;
      vertical-align: top;
      line-height: 1.7;
      border-bottom: 1px solid var(--color-line);
    }

    #ordersTable thead th {
      font-size: 0.75rem;
      font-weight: 400;
      letter-spacing: 0.16em;
      white-space: nowrap;
      color: var(--color-ink-soft);
      background: var(--color-cream);
      border-bottom: 1px solid var(--color-accent-soft);
    }

    #ordersTable tbody tr:last-child td {
      border-bottom: 0;
    }

    #ordersTable tbody tr:hover {
      background: var(--color-ivory);
    }

    #ordersTable td:first-child {
      white-space: nowrap;
      color: var(--color-muted);
    }

    #ordersTable td:nth-child(5) {
      white-space: nowrap;
      font-family: var(--font-serif);
      font-size: 1.05rem;
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container site-header__inner">
      <a class="brand" href="index.html">Body Scent</a>
      <nav class="nav">
        <a href="index.html">หน้าแรก</a>
        <a href="product.html">สินค้า</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container">

        <div class="section__header">
          <span class="eyebrow">Admin</span>
          <h1>รายการคำสั่งซื้อ</h1>
          <hr class="divider">
          <p class="lead">คำสั่งซื้อล่าสุดแสดงอยู่ด้านบน ข้อมูลอาจอัปเดตช้าได้ราว 5 นาที</p>
        </div>

        <div class="table-wrap">
          <table id="ordersTable">
            <thead>
              <tr>
                <th>วันเวลา</th>
                <th>ชื่อลูกค้า</th>
                <th>เบอร์โทร/Line</th>
                <th>รายการสินค้า</th>
                <th>จำนวนเงินรวม</th>
                <th>หมายเหตุ</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>

      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <a class="brand" href="index.html">Body Scent</a>
      <p>&copy; Body Scent. All rights reserved.</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
